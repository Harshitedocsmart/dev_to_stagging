name: Dev to Staging CI/CD

on:
  push:
    branches: [ dev ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: python dev_2_stagging/manage.py test

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/my-django-api:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/my-django-api:latest .

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/my-django-api:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/my-django-api:latest

    - name: Auto Merge into Staging
      uses: devmasx/merge-branch@v1.3.1
      with:
        type: now
        from_branch: dev
        target_branch: staging
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
